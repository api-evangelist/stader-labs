name: Stader Labs
description: 'Stader Labs is a non-custodial, smart-contract-driven liquid staking platform for
  Proof-of-Stake networks. It lets retail users, exchanges, and custodians stake crypto and receive
  tokenized liquid staking tokens (ETHx, MaticX, BNBx, NEARx and others) that stay usable across 40+
  DeFi protocols while earning auto-compounding rewards, with no lock-up and no minimum stake. Stader
  operates as multi-chain middleware infrastructure across Ethereum, Polygon, BNB Chain, Hedera,
  Fantom, and NEAR, and its contracts have been audited by Sigma Prime, Halborn, Peckshield, Code4rena,
  and OtterSec. The project is on-chain and open source rather than a REST/OpenAPI provider; developer
  surface area is Solidity/Go/Rust smart contracts, node software, and CLI tooling on GitHub.'
